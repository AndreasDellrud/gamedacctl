[package]
name = "gamedacctl"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
description = "Linux lighting control for the original SteelSeries GameDAC"
publish = false

[dependencies]
adw = { package = "libadwaita", version = "0.9.2", features = ["gtk_v4_22", "v1_9"] }
directories = "6.0"
clap = { version = "4.5", features = ["derive"] }
gtk = { package = "gtk4", version = "0.11.4", features = ["v4_22"] }
hidapi = { version = "2.6", default-features = false, features = ["linux-native-basic-udev"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

[dev-dependencies]
sha2 = "0.11"
tempfile = "3.22"

[profile.release]
strip = true
lto = "thin"

[[bin]]
name = "gamedacctl-gui"
path = "src/bin/gamedacctl-gui.rs"
