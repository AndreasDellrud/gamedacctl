[package]
name = "gamedacctl"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Linux lighting control for the original SteelSeries GameDAC"
publish = false

[dependencies]
clap = { version = "4.5", features = ["derive"] }
hidapi = { version = "2.6", default-features = false, features = ["linux-native-basic-udev"] }
thiserror = "2.0"

[dev-dependencies]
sha2 = "0.10"

[profile.release]
strip = true
lto = "thin"
